function getRandomWeightEvent() {
  const totalWeight = eventList.reduce((sum, item) => sum + item.weight, 0);
  let r = Math.random() * totalWeight;
  for(const evt of eventList){
    r -= evt.weight;
    if(r <= 0) return evt;
  }
  return eventList[0];
}

let cart = JSON.parse(localStorage.getItem("pigCart")) || [];
let orders = JSON.parse(localStorage.getItem("pigOrders")) || [];
let saveRecord = JSON.parse(localStorage.getItem("pigSaveRecord")) || {};

function renderGoods(keyword=""){
  const wrap = document.getElementById("goodsList");
  wrap.innerHTML = "";
  const kw = keyword.trim().toLowerCase();
  const filter = goods.filter(g=> g.name.toLowerCase().includes(kw) || g.tag.toLowerCase().includes(kw));
  filter.forEach(item=>{
    const div = document.createElement("div");
    div.className = "goods-item";
    div.innerHTML = `
      <div class="goods-img">🍽️</div>
      <div class="goods-info">
        <div class="goods-name">${item.name}</div>
        <div class="goods-desc">${item.desc}</div>
        <div class="goods-price">¥${item.price.toFixed(2)}</div>
        <button class="add-btn" data-name="${item.name}" data-price="${item.price}">加入购物车</button>
      </div>
    `;
    wrap.appendChild(div);
  })
  document.querySelectorAll(".add-btn").forEach(btn=>{
    btn.onclick = ()=>{
      cart.push({name:btn.dataset.name,price:Number(btn.dataset.price)});
      saveCart();
      updateCartUI();
    }
  })
}
function saveCart(){
  localStorage.setItem("pigCart", JSON.stringify(cart));
}
function updateCartUI(){
  const total = cart.reduce((s,i)=> s+i.price, 0);
  document.getElementById("cartNum").innerText = cart.length;
  document.getElementById("cartTotal").innerText = total.toFixed(2);
}

document.getElementById("settleBtn").onclick = function(){
  if(cart.length === 0){alert("购物车是空的哦");return;}
  const total = cart.reduce((s,i)=> s+i.price, 0);
  const today = new Date().toISOString().slice(0,10);
  if(!saveRecord[today]) saveRecord[today] = 0;
  saveRecord[today] += total;
  localStorage.setItem("pigSaveRecord", JSON.stringify(saveRecord));

  const order = {
    id: Date.now(),
    list: [...cart],
    total: total,
    step:0,
    steps:["商家接单","餐品制作完成","骑手取餐","骑手配送中","已送达"],
    timer:null
  };
  orders.unshift(order);
  localStorage.setItem("pigOrders", JSON.stringify(orders));
  cart = [];
  saveCart();
  updateCartUI();
  runOrder(order);
}

function runOrder(order){
  const modal = document.getElementById("orderModal");
  modal.style.display = "flex";
  function renderStep(){
    const wrap = document.getElementById("orderSteps");
    wrap.innerHTML = "";
    order.steps.forEach((s,idx)=>{
      const cls = idx < order.step ? "step done" : (idx === order.step ? "step current" : "step");
      wrap.innerHTML += `<div class="${cls}">${idx<order.step?"✅":"⏳"} ${s}</div>`
    })
  }
  renderStep();
  function nextStep(){
    order.step += 1;
    renderStep();
    localStorage.setItem("pigOrders", JSON.stringify(orders));
    if(order.step >= order.steps.length){
      alert("✅ 外卖送到啦！你成功忍住没有真的下单，猪瘾治疗+¥"+order.total.toFixed(2));
      return;
    }
    if(Math.random() < EVENT_CHANCE){
      const evt = getRandomWeightEvent();
      showEvent(evt, ()=>{
        const delay = 22000 + Math.random()*18000;
        order.timer = setTimeout(nextStep, delay);
      })
    }else{
      const delay = 22000 + Math.random()*18000;
      order.timer = setTimeout(nextStep, delay);
    }
  }
  const delay0 = 2500 + Math.random()*3000;
  order.timer = setTimeout(nextStep, delay0);
}

function showEvent(evt, callback){
  const m = document.getElementById("eventModal");
  document.getElementById("eventTitle").innerText = evt.title;
  document.getElementById("eventDesc").innerText = evt.desc;
  const btnA = document.getElementById("optA");
  const btnB = document.getElementById("optB");
  btnA.innerText = evt.optA;
  btnB.innerText = evt.optB;
  m.style.display = "flex";
  function close(){
    m.style.display = "none";
    callback();
  }
  btnA.onclick = ()=>{
    alert("👉 "+evt.resA);
    close();
  }
  btnB.onclick = ()=>{
    alert("👉 "+evt.resB);
    close();
  }
}

document.getElementById("stat-btn").onclick = function(){

  document.getElementById("statModal").style.display = "flex";
}
document.getElementById("closeStatModal").onclick = function(){
  document.getElementById("statModal").style.display = "none";
}
function calcStat(){
  const now = new Date();
  let day=0,week=0,month=0;
  for(const dStr in saveRecord){
    const d = new Date(dStr);
    const val = saveRecord[dStr];
    if(d.toDateString() === now.toDateString()) day += val;
    const diff = (now - d)/(1000*3600*24);
    if(diff < 7) week += val;
    if(d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) month += val;
  }
  document.getElementById("daySave").innerText = "¥"+day.toFixed(2);
  document.getElementById("weekSave").innerText = "¥"+week.toFixed(2);
  document.getElementById("monthSave").innerText = "¥"+month.toFixed(2);
}

document.getElementById("search-input").oninput = function(){
  renderGoods(this.value);
}

document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    const t = tab.dataset.tab;
    if(t === "food"){
      document.getElementById("goodsList").style.display = "grid";
    }else{
      document.getElementById("goodsList").style.display = "none";
      alert("订单页面后续扩展，现在下单后会自动弹出配送窗口");
    }
  }
})

calcStat();
