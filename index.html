<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{background:#f5f5f5;padding-bottom:90px;}
header{background:#ff4444;color:white;padding:14px 16px;position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;}
header h1{font-size:18px;}
.tab-bar{display:flex;background:white;position:sticky;top:52px;z-index:98;}
.tab{flex:1;text-align:center;padding:10px 0;font-size:14px;color:#666;border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:#ff4444;border-color:#ff4444;font-weight:bold;}
.search-wrap{padding:10px;background:white;position:sticky;top:80px;z-index:97;}
#search-input{width:100%;padding:10px 14px;border-radius:20px;border:1px solid #ddd;font-size:14px;outline:none;}

/* 左右布局容器 */
.flex-container{display:flex;min-height:calc(100vh - 170px);}
/* 左侧店铺菜单 */
.sidebar{width:140px;background:#fff;overflow-y:auto;}
.sidebar-item{padding:12px 8px;text-align:center;font-size:13px;color:#444;border-bottom:1px solid #f0f0f0;cursor:pointer;}
.sidebar-item.active{background:#ff4444;color:white;}
/* 右侧菜品区域 */
.food-main{flex:1;padding:10px;overflow-y:auto;}
.goods-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));gap:12px;}
.goods-item{background:white;border-radius:10px;overflow:hidden;}
.goods-img{height:140px;width:100%;background:#eee;}
.goods-img img{width:100%;height:100%;object-fit:cover;}
.goods-info{padding:8px;}
.goods-name{font-size:13px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.goods-desc{font-size:11px;color:#888;height:28px;overflow:hidden;line-height:1.3;}
.goods-price{color:#ff4444;font-weight:bold;margin:4px 0;font-size:14px;}
.add-btn{width:100%;padding:5px;background:#ff4444;color:white;border:none;border-radius:5px;cursor:pointer;font-size:12px;}

.cart-bar{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px 14px;display:flex;align-items:center;gap:10px;border-top:1px solid #ddd;z-index:99;}
.cart-info{flex:1;}
.cart-total{font-size:14px;}
.cart-count{color:#ff4444;}
.settle-btn{padding:10px 18px;background:#ff4444;color:white;border:none;border-radius:22px;font-weight:bold;cursor:pointer;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;display:none;padding:16px;}
.modal-box{background:white;border-radius:14px;max-width:420px;width:100%;padding:20px;max-height:85vh;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:bold;margin-bottom:12px;}
.modal-desc{color:#555;line-height:1.6;margin-bottom:16px;}
.opt-row{display:flex;gap:10px;}
.opt-btn{flex:1;padding:10px;border:1px solid #ff4444;background:white;color:#ff4444;border-radius:8px;cursor:pointer;}
.opt-btn.primary{background:#ff4444;color:white;}
.order-modal .step{padding:8px 0;border-bottom:1px solid #eee;}
.step.done{color:#22bb22;}
.step.current{color:#ff4444;font-weight:bold;}
.stat-item{padding:8px 0;display:flex;justify-content:space-between;}
.order-item{background:white;border-radius:12px;margin:10px;padding:12px;}
.order-time{font-size:12px;color:#777;margin-bottom:6px;}
.order-shopname{font-weight:bold;margin-bottom:6px;}
.order-line{font-size:13px;color:#444;padding:2px 0;}
.order-sum{margin-top:6px;padding-top:6px;border-top:1px dashed #eee;font-weight:bold;color:#ff4444;}

@media (min-width:769px){

function getRandomWeightEvent() {
  const totalWeight = eventList.reduce((sum, item) => sum + item.weight, 0);
  let r = Math.random() * totalWeight;
  for(const evt of eventList){
    r -= evt.weight;
    if(r <= 0) return evt;
  }
  return eventList[0];
}
