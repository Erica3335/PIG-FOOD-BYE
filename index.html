<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍔 猪瘾治疗 · 模拟外卖</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ff4444">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
body{background:#f2f2f5;color:#333;padding-bottom:96px;}
header{background:#ff4444;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;}
header h1{font-size:17px;font-weight:700;}
.stat-btn{border:none;background:rgba(255,255,255,.18);color:#fff;padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;}

.tab-bar{display:flex;background:#fff;position:sticky;top:52px;z-index:98;}
.tab{flex:1;text-align:center;padding:11px 0;font-size:14px;color:#666;border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:#ff4444;border-color:#ff4444;font-weight:700;}

.search-wrap{padding:10px 12px;background:#fff;}
#search-input{width:100%;padding:10px 14px;border-radius:20px;border:1px solid #e3e3e3;font-size:14px;outline:none;background:#f7f7f7;}

/* 点餐主区：手机上下结构，宽屏左右双栏 */
.app{display:flex;gap:12px;padding:10px;}
.shop-side{width:240px;flex:none;}
.goods-side{flex:1;min-width:0;}

/* 店铺列表 */
.shop-card{background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden;cursor:pointer;display:flex;gap:10px;padding:10px;transition:box-shadow .15s;}
.shop-card:active{box-shadow:0 2px 10px rgba(0,0,0,.15);}
.shop-card.active{outline:2px solid #ff4444;}
.shop-cover{width:64px;height:64px;border-radius:10px;flex:none;overflow:hidden;background:linear-gradient(135deg,#fff3e6,#ffe1e1);display:grid;place-items:center;}
.shop-cover .fallback{display:grid;place-items:center;font-size:30px;}
.shop-meta{min-width:0;display:flex;flex-direction:column;justify-content:center;}
.shop-name{font-size:15px;font-weight:700;}
.shop-sub{font-size:12px;color:#888;margin-top:3px;}

/* 店铺头部返回栏 */
.shop-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.back-btn{border:1px solid #ddd;background:#fff;border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer;}
.shop-head-title{font-size:17px;font-weight:700;}

/* 菜品网格 */
.goods-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.goods-item{background:#fff;border-radius:12px;overflow:hidden;}
.goods-img{height:110px;display:grid;place-items:center;background:linear-gradient(135deg,#fff3e6,#ffe1e1);}
.goods-img .fallback{display:grid;place-items:center;font-size:44px;}
.goods-info{padding:10px;}
.goods-name{font-size:14px;font-weight:600;margin-bottom:3px;}
.goods-desc{font-size:12px;color:#888;line-height:1.4;margin-bottom:6px;}
.meta-row{font-size:11px;color:#666;line-height:1.5;margin-top:2px;}
.meta-row b{color:#333;font-weight:600;}
.tag-chips{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0;}
.tag-chip{font-size:10px;color:#ff6b35;background:#fff0e6;border-radius:6px;padding:2px 7px;}
.fresh-tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:#22a05a;background:#eafaf0;border-radius:6px;padding:2px 7px;margin-top:3px;}
.goods-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.goods-price{color:#ff4444;font-weight:700;font-size:15px;}
.add-btn{width:28px;height:28px;border:none;background:#ff4444;color:#fff;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;}

.empty-tip{text-align:center;padding:50px 20px;color:#999;font-size:14px;}

/* 购物车栏 */
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-top:1px solid #eee;z-index:99;}
.cart-info{flex:1;min-width:0;}
.cart-count{color:#ff4444;font-weight:700;}
.cart-total{font-size:14px;}
.settle-btn{padding:10px 18px;background:#ff4444;color:#fff;border:none;border-radius:22px;font-weight:700;cursor:pointer;}

/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-box{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:20px;max-height:85vh;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:12px;}
.modal-desc{color:#555;line-height:1.6;margin-bottom:16px;}
.opt-row{display:flex;gap:10px;}
.opt-btn{flex:1;padding:10px;border:1px solid #ff4444;background:#fff;color:#ff4444;border-radius:8px;cursor:pointer;font-size:14px;}
.opt-btn.primary{background:#ff4444;color:#fff;border-color:#ff4444;}
.step{padding:8px 0;border-bottom:1px solid #eee;font-size:14px;}
.step.done{color:#22bb22;}
.step.current{color:#ff4444;font-weight:700;}
.stat-item{padding:9px 0;display:flex;justify-content:space-between;font-size:14px;}

/* 订单 */
.order-item{background:#fff;border-radius:12px;margin:10px;padding:12px;}
.order-time{font-size:12px;color:#777;margin-bottom:6px;}
.order-shopname{font-weight:700;margin-bottom:6px;}
.order-line{font-size:13px;color:#444;padding:2px 0;}
.order-sum{margin-top:6px;padding-top:6px;border-top:1px dashed #eee;font-weight:700;color:#ff4444;}

/* 宽屏双栏 */
@media (min-width:768px){
  .shop-side{width:260px;}
  .goods-grid{grid-template-columns:repeat(3,1fr);}
}
/* 窄屏：店铺/菜品视图切换，隐藏侧栏 */
@media (max-width:767px){
  .app{padding:10px;}
  .shop-side.hidden{display:none;}
  .goods-side.hidden{display:none;}
}
</style>
</head>
<body>
<header>
  <h1>🍔 猪瘾治疗外卖模拟器</h1>

<div class="tab-bar">

function getRandomWeightEvent(){
  const total = eventList.reduce((s,i)=>s+i.weight,0);
  let r = Math.random()*total;
  for(const e of eventList){ r-=e.weight; if(r<=0) return e; }
  return eventList[0];
}
const EVENT_CHANCE = 0.35;

};
function foodIcon(pool, i){
  const arr = EMOJI[pool] || ["🍽️"];

}

// 取某菜品的完整描述（菜品可在条目里用 ing/mat/flav/fresh 覆盖默认值）
function getMeta(pool, g){
  const base = META[pool] || META.snack;
  return {
    ing: g.ing || base.ing,
    mat: g.mat || base.mat,
    flav: g.flav || base.flav,
    fresh: g.fresh || base.fresh
  };
}

/* ================= 店铺与菜品数据 ================= */

/* ================= 状态与存储 ================= */
let cart = [];
let orderList = JSON.parse(localStorage.getItem("pigOrderList") || "[]");
let saveRecord = JSON.parse(localStorage.getItem("pigSaveRecord") || "{}");
let currentShop = -1;
let currentSearch = "";
let isComposing = false;

const shopSide = document.getElementById("shopSide");
const goodsSide = document.getElementById("goodsSide");

/* ================= 渲染：店铺列表 ================= */
function renderShops(){
  shopSide.innerHTML = "";
  shopGoods.forEach((s, idx)=>{
    const card = document.createElement("div");
    card.className = "shop-card" + (idx===currentShop ? " active" : "");
    card.innerHTML = `
      <div class="shop-cover">
        <div class="fallback">${s.emoji}</div>
      </div>
      <div class="shop-meta">
        <div class="shop-name">${s.shop}</div>
        <div class="shop-sub">共 ${s.goods.length} 道 · 模拟店铺</div>
      </div>`;
    card.onclick = ()=>openShop(idx);
    shopSide.appendChild(card);
  });
}

/* 菜品信息区：描述 + 食材 + 配料 + 风味 + 新鲜度 */
function goodsInfoHtml(s, g, i, withShopName){
  const meta = getMeta(s.pool, g);
  const descExtra = withShopName ? ` · ${s.shop.split("｜")[0]}` : "";
  return `
    <div class="goods-info">
      <div class="goods-name">${g.n}</div>
      <div class="goods-desc">${g.d}${descExtra}</div>
      <div class="meta-row"><b>食材：</b>${meta.ing}</div>
      <div class="meta-row"><b>配料：</b>${meta.mat}</div>
      <div class="tag-chips"><span class="tag-chip">风味：${meta.flav.join(" / ")}</span></div>
      <div class="fresh-tag">🌿 新鲜度：${meta.fresh}</div>
      <div class="goods-foot">
        <div class="goods-price">¥${g.p.toFixed(2)}</div>
        <button class="add-btn" data-shop="${s.shop}" data-name="${g.n}" data-price="${g.p}">+</button>
      </div>
    </div>`;
}

/* ================= 渲染：单店菜品 ================= */
function renderShop(idx){
  const s = shopGoods[idx];
  goodsSide.innerHTML = `
    <div class="shop-head">
      <button class="back-btn" id="backBtn">‹ 返回店铺</button>
      <div class="shop-head-title">${s.shop}</div>
    </div>
    <div class="goods-grid"></div>`;
  const grid = goodsSide.querySelector(".goods-grid");
  s.goods.forEach((g, i)=>{
    const div = document.createElement("div");
    div.className = "goods-item";
    div.innerHTML = `
      <div class="goods-img">
        <div class="fallback">${foodIcon(s.pool, i)}</div>
      </div>
      ${goodsInfoHtml(s, g, i, false)}`;
    grid.appendChild(div);
  });
  bindAddButtons(grid);
  document.getElementById("backBtn").onclick = backToList;
}

/* ================= 渲染：搜索结果（跨店） ================= */
function renderSearchResult(){
  const kw = currentSearch.trim();
  let html = `<div class="shop-head"><div class="shop-head-title">搜索结果：“${kw}”</div></div><div class="goods-grid">`;
  let count = 0;
  shopGoods.forEach((s)=>{
    s.goods.forEach((g, i)=>{
      const meta = getMeta(s.pool, g);
      const metaText = `${meta.ing}${meta.mat}${meta.flav.join("")}${meta.fresh}`;
      if(s.shop.includes(kw) || g.n.includes(kw) || g.d.includes(kw) || metaText.includes(kw)){
        count++;
        html += `
        <div class="goods-item">
          <div class="goods-img">
            <div class="fallback">${foodIcon(s.pool, i)}</div>
          </div>
          ${goodsInfoHtml(s, g, i, true)}
        </div>`;
      }
    });
  });
  html += `</div>`;
  if(count === 0) html = `<div class="empty-tip">没有找到相关菜品，换个关键词试试</div>`;
  goodsSide.innerHTML = html;
  bindAddButtons(goodsSide);
}

/* ================= 视图切换 ================= */
function openShop(idx){
  currentShop = idx;
  currentSearch = "";
  document.getElementById("search-input").value = "";
  renderShops();
  renderShop(idx);
  shopSide.classList.add("hidden");
  goodsSide.classList.remove("hidden");
}
function backToList(){
  currentShop = -1;
  currentSearch = "";
  document.getElementById("search-input").value = "";
  renderShops();
  goodsSide.classList.add("hidden");
  shopSide.classList.remove("hidden");
}
function refreshView(){
  if(currentSearch.trim()){
    goodsSide.classList.remove("hidden");
    shopSide.classList.add("hidden");
    renderSearchResult();
  } else if(currentShop >= 0){
    renderShop(currentShop);
  } else {
    renderShops();
  }
}

/* ================= 购物车 ================= */
function bindAddButtons(scope){
  scope.querySelectorAll(".add-btn").forEach(btn=>{
    btn.onclick = ()=>{
      cart.push({shop:btn.dataset.shop, name:btn.dataset.name, price:Number(btn.dataset.price)});
      updateCart();
    };
  });
}
function updateCart(){
  document.getElementById("cartNum").innerText = cart.length;
  const total = cart.reduce((s,i)=>s+i.price,0);
  document.getElementById("cartTotal").innerText = total.toFixed(2);
}

/* ================= 标签切换 ================= */
document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    const t = tab.dataset.tab;
    document.getElementById("foodPage").style.display = t==="food" ? "block" : "none";
    document.getElementById("orderPage").style.display = t==="order" ? "block" : "none";
    if(t==="order") renderOrderList();
  };
});

/* ================= 搜索（兼容中文输入法） ================= */
const searchInput = document.getElementById("search-input");
searchInput.addEventListener("compositionstart", ()=>{ isComposing = true; });
searchInput.addEventListener("compositionend", ()=>{
  isComposing = false;
  currentSearch = searchInput.value;
  refreshView();
});
searchInput.addEventListener("input", ()=>{
  if(isComposing) return;
  currentSearch = searchInput.value;
  refreshView();
});

/* ================= 订单历史 ================= */
function renderOrderList(){
  const wrap = document.getElementById("orderListWrap");
  if(orderList.length === 0){
    wrap.innerHTML = `<div class="empty-tip">暂无历史订单</div>`;
    return;
  }
  wrap.innerHTML = "";
  [...orderList].reverse().forEach(ord=>{
    let itemHtml = "";
    ord.list.forEach(i=>{
      itemHtml += `<div class="order-line">▪ ${i.name}  ¥${i.price.toFixed(2)}</div>`;
    });
    wrap.innerHTML += `
    <div class="order-item">
      <div class="order-time">下单时间：${ord.timeStr}</div>
      <div class="order-shopname">订单编号：${ord.id}</div>
      ${itemHtml}
      <div class="order-sum">订单总金额：¥${ord.total.toFixed(2)}</div>
    </div>`;
  });
}

/* ================= 结算下单 ================= */
document.getElementById("settleBtn").onclick = ()=>{
  if(cart.length === 0) return alert("购物车是空的");
  const total = cart.reduce((s,i)=>s+i.price,0);
  const now = new Date();
  const newOrder = {
    id:"ORD"+Date.now(),
    time:now.getTime(),
    timeStr:now.toLocaleString(),
    list:[...cart],
    total
  };
  orderList.push(newOrder);
  localStorage.setItem("pigOrderList", JSON.stringify(orderList));

  const dayKey = now.toLocaleDateString();
  if(!saveRecord[dayKey]) saveRecord[dayKey] = 0;
  saveRecord[dayKey] += total;
  localStorage.setItem("pigSaveRecord", JSON.stringify(saveRecord));

  cart = [];
  updateCart();
  startDelivery(newOrder);
};

/* ================= 配送流程 + 骑手奇遇 ================= */
let deliveryTimer = null;
function startDelivery(order){
  const modal = document.getElementById("orderModal");
  const stepWrap = document.getElementById("orderSteps");
  modal.style.display = "flex";
  const steps = [
    {txt:"商家已接单", done:true},
    {txt:"骑手正在赶往商家取餐", done:false},
    {txt:"骑手已取餐，正在配送", done:false},
    {txt:"订单送达！猪瘾压制成功 ✅", done:false}
  ];
  function renderStep(){
    stepWrap.innerHTML = "";
    steps.forEach((s,idx)=>{
      const cls = s.done ? "step done" : (!s.done && steps.findIndex(x=>!x.done)===idx ? "step current" : "step");
      stepWrap.innerHTML += `<div class="${cls}">${s.done?"✅":"⏳"} ${s.txt}</div>`;
    });
  }
  renderStep();
  let stepIndex = 1;
  function nextStep(){
    if(stepIndex >= steps.length) return;
    steps[stepIndex].done = true;
    renderStep();
    stepIndex++;
    if(Math.random() < EVENT_CHANCE){
      const evt = getRandomWeightEvent();
      showEvent(evt, ()=>{ deliveryTimer = setTimeout(nextStep, 4000+Math.random()*4000); });
    } else {
      deliveryTimer = setTimeout(nextStep, 4000+Math.random()*4000);
    }
  }
  deliveryTimer = setTimeout(nextStep, 3000);
}

function showEvent(evt, cb){
  clearTimeout(deliveryTimer);
  const m = document.getElementById("eventModal");
  document.getElementById("eventTitle").innerText = evt.title;
  document.getElementById("eventDesc").innerText = evt.desc;
  document.getElementById("optA").innerText = evt.optA;
  document.getElementById("optB").innerText = evt.optB;
  m.style.display = "flex";
  function close(){ m.style.display = "none"; cb(); }
  document.getElementById("optA").onclick = ()=>{ alert(evt.resA); close(); };
  document.getElementById("optB").onclick = ()=>{ alert(evt.resB); close(); };
}

document.getElementById("remindBtn").onclick = ()=>{
  alert("📢 已经帮你提醒骑手啦！骑手收到催单消息，会加快速度~");
};
document.getElementById("closeOrderModal").onclick = ()=>{
  document.getElementById("orderModal").style.display = "none";
};

/* ================= 统计 ================= */
document.getElementById("stat-btn").onclick = ()=>{
  const now = new Date();
  const todayStr = now.toLocaleDateString();
  let day = saveRecord[todayStr] || 0, week = 0, month = 0;
  Object.entries(saveRecord).forEach(([k,v])=>{
    const d = new Date(k);
    const diff = (now - d)/(1000*60*60*24);
    if(diff < 7) week += v;
    if(diff < 31) month += v;
  });
