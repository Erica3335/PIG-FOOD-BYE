function getRandomWeightEvent() {
  const totalWeight = eventList.reduce((sum, item) => sum + item.weight, 0);
  let r = Math.random() * totalWeight;
  for(const evt of eventList){
    r -= evt.weight;
    if(r <= 0) return evt;
  }
  return eventList[0];
}

// ========== 数据存储 ==========
let cart = [];
let orderList = JSON.parse(localStorage.getItem("pigOrderList") || "[]");
let saveRecord = JSON.parse(localStorage.getItem("pigSaveRecord") || "{}");
let currentSearch = "";

// 渲染商品
function renderGoods(){
  const wrap = document.getElementById("goodsWrap");
  wrap.innerHTML = "";
  shopGoods.forEach(shop=>{
    const filterGoods = shop.goods.filter(g=>{
      if(!currentSearch) return true;
      const kw = currentSearch.trim();
      return shop.shopName.includes(kw) || g.name.includes(kw) || g.desc.includes(kw);
    });
    if(filterGoods.length === 0) return;
    wrap.innerHTML += `<div class="shop-title">${shop.shopName}</div><div class="goods-list">`;
    filterGoods.forEach(g=>{
      wrap.innerHTML += `
      <div class="goods-item">
        <div class="goods-img">
          <img src="${g.img}" crossorigin="anonymous" alt="${g.name}">
        </div>
        <div class="goods-info">
          <div class="goods-name">${g.name}</div>
          <div class="goods-desc">${g.desc}</div>
          <div class="goods-price">¥${g.price.toFixed(2)}</div>
          <button class="add-btn" data-shop="${shop.shopName}" data-name="${g.name}" data-price="${g.price}" data-img="${g.img}">加入购物车</button>
        </div>
      </div>
      `;
    })
    wrap.innerHTML += `</div>`;
  })
  document.querySelectorAll(".add-btn").forEach(btn=>{
    btn.onclick = ()=>{
      cart.push({
        shop:btn.dataset.shop,
        name:btn.dataset.name,
        price:Number(btn.dataset.price),
        img:btn.dataset.img
      })
      updateCart();
    }
  })
}

function updateCart(){
  document.getElementById("cartNum").innerText = cart.length;
  const total = cart.reduce((s,i)=>s+i.price,0);
  document.getElementById("cartTotal").innerText = total.toFixed(2);
}

// 渲染订单列表（时间线+明细）
function renderOrderList(){
  const wrap = document.getElementById("orderListWrap");
  if(orderList.length === 0){
    wrap.innerHTML = `<div class="empty-tip">暂无历史订单</div>`;
    return;
  }
  wrap.innerHTML = "";
  // 新订单放最上面
  [...orderList].reverse().forEach(ord=>{
    let itemHtml = "";
    ord.list.forEach(i=>{
      itemHtml += `<div class="order-line">▪ ${i.name}  ¥${i.price.toFixed(2)}</div>`;
    })
    wrap.innerHTML += `
    <div class="order-item">
      <div class="order-time">下单时间：${ord.timeStr}</div>
      <div class="order-shopname">订单编号：${ord.id}</div>
      ${itemHtml}
      <div class="order-sum">订单总金额：¥${ord.total.toFixed(2)}</div>
    </div>
    `
  })
}

// 切换标签
document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    const t = tab.dataset.tab;
    document.getElementById("foodPage").style.display = t==="food" ? "block" : "none";
    document.getElementById("orderPage").style.display = t==="order" ? "block" : "none";
    if(t==="order") renderOrderList();
  }
})

// 搜索
document.getElementById("search-input").oninput = (e)=>{
  currentSearch = e.target.value.trim();
  renderGoods();
}

// 结算下单
document.getElementById("settleBtn").onclick = ()=>{
  if(cart.length === 0) return alert("购物车是空的");
  const total = cart.reduce((s,i)=>s+i.price,0);
  const now = new Date();
  const timeStr = now.toLocaleString();
  const orderId = "ORD"+Date.now();
  const newOrder = {
    id:orderId,
    time:now.getTime(),
    timeStr,
    list:[...cart],
    total
  };
  orderList.push(newOrder);
  localStorage.setItem("pigOrderList", JSON.stringify(orderList));

  // 统计节省金额
  const dayKey = now.toLocaleDateString();
  if(!saveRecord[dayKey]) saveRecord[dayKey] = 0;
  saveRecord[dayKey] += total;
  localStorage.setItem("pigSaveRecord", JSON.stringify(saveRecord));

  cart = [];
  updateCart();
  startDelivery(newOrder);
}

// 配送流程 + 骑手随机事件
let deliveryTimer = null;
function startDelivery(order){
  const modal = document.getElementById("orderModal");
  const stepWrap = document.getElementById("orderSteps");
  modal.style.display = "flex";
  const steps = [
    {txt:"商家已接单",done:true},
    {txt:"骑手正在赶往商家取餐",done:false},
    {txt:"骑手已取餐，正在配送",done:false},
    {txt:"订单送达！猪瘾压制成功 ✅",done:false}
  ];
  function renderStep(){
    let html = "";
    steps.forEach((s,idx)=>{
      html += `<div class="step ${s.done ? 'done' : ''} ${(!s.done && steps.findIndex(x=>!x.done)===idx) ? 'current' : ''}">${s.txt}</div>`
    })
    stepWrap.innerHTML = html;
  }
  renderStep();
  let stepIndex = 1;
  function nextStep(){
    if(stepIndex >= steps.length) return;
    steps[stepIndex].done = true;
    renderStep();
    stepIndex++;
    // 随机触发骑手奇遇
    if(Math.random() < EVENT_CHANCE){
      const evt = getRandomWeightEvent();
      showEvent(evt, ()=>{
        setTimeout(nextStep, 4000 + Math.random()*4000);
      })
    }else{
      deliveryTimer = setTimeout(nextStep, 4000 + Math.random()*4000);
    }
  }
  deliveryTimer = setTimeout(nextStep, 3000);
}

// 骑手弹窗
function showEvent(evt, cb){
  clearTimeout(deliveryTimer);
  const m = document.getElementById("eventModal");
  document.getElementById("eventTitle").innerText = evt.title;
  document.getElementById("eventDesc").innerText = evt.desc;
  document.getElementById("optA").innerText = evt.optA;
  document.getElementById("optB").innerText = evt.optB;
  m.style.display = "flex";
  function close(){
    m.style.display = "none";
    cb();
  }
  document.getElementById("optA").onclick = ()=>{
    alert(evt.resA); close();
  }
  document.getElementById("optB").onclick = ()=>{
    alert(evt.resB); close();
  }
}

// 催单
document.getElementById("remindBtn").onclick = ()=>{
  alert("📢 已经帮你提醒骑手啦！骑手收到催单消息，会加快速度~");
}
document.getElementById("closeOrderModal").onclick = ()=>{
  document.getElementById("orderModal").style.display = "none";
}

// 统计面板
document.getElementById("stat-btn").onclick = ()=>{
  const now = new Date();
  const todayStr = now.toLocaleDateString();
  let day = saveRecord[todayStr] || 0;
  let week = 0, month = 0;
  Object.entries(saveRecord).forEach(([k,v])=>{
    const d = new Date(k);
    const diff = (now - d)/(1000*60*60*24);
    if(diff < 7) week += v;
    if(diff < 31) month += v;
  })
  document.getElementById("daySave").innerText = "¥"+day.toFixed(2);
  document.getElementById("weekSave").innerText = "¥"+week.toFixed(2);
  document.getElementById("monthSave").innerText = "¥"+month.toFixed(2);
  document.getElementById("statModal").style.display = "flex";
}
document.getElementById("closeStatModal").onclick = ()=>{
  document.getElementById("statModal").style.display = "none";
}

// 初始化
renderGoods();
updateCart();
renderOrderList();
</script>
