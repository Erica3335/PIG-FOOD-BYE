<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{background:#f5f5f5;color:#333;padding-bottom:100px}
header{background:#ff4d4f;color:white;padding:14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:99}
.search-wrap{flex:1}
#searchInput{width:100%;border:0;border-radius:20px;padding:8px 14px;font-size:14px;outline:none}
.container{display:flex}
.left-shop{width:110px;background:#fff;height:calc(100vh - 56px);overflow-y:auto;position:sticky;top:56px}
.shop-item{padding:14px 8px;text-align:center;border-bottom:1px solid #eee;font-size:13px;cursor:pointer}
.shop-item.active{background:#fff2f2;color:#ff4d4f;font-weight:bold}
.right-food{flex:1;padding:12px;overflow-y:auto;height:calc(100vh - 56px)}
.food-card{background:#fff;border-radius:10px;padding:10px;margin-bottom:10px;display:flex;gap:10px}
.food-info{flex:1}
.food-name{font-weight:bold;margin-bottom:4px}
.food-desc{font-size:12px;color:#777;margin-bottom:6px}
.food-price{color:#ff4d4f}
.add-btn{background:#ff4d4f;color:#fff;border:0;border-radius:16px;padding:4px 10px;cursor:pointer}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;border-top:1px solid #ddd}
.cart-info{flex:1}
.submit-order{background:#ff4d4f;color:white;border:0;padding:8px 18px;border-radius:20px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:999}
.modal-box{background:#fff;width:85%;max-width:420px;border-radius:12px;padding:20px}
.modal h3{margin-bottom:12px}
.opt-btn{width:100%;margin:6px 0;padding:10px;border:1px solid #ff4d4f;background:#fff;color:#ff4d4f;border-radius:8px;cursor:pointer}
.opt-btn.primary{background:#ff4d4f;color:#fff}
.stat-wrap{padding:12px;background:#fff;border-radius:10px;margin:12px}
.event-text{margin:10px 0;line-height:1.6}
</style>
</head>

<header>
  <div class="search-wrap">
    <input id="searchInput" placeholder="搜索：奶茶 / 蛋糕 / 西湖醋鱼 / 火锅食材">
  </div>
</header>
<div class="container">
  <div class="left-shop" id="shopList"></div>
  <div class="right-food" id="foodList"></div>
</div>

<div class="cart-bar">
  <div class="cart-info">购物车：<span id="cartNum">0</span>件｜合计 ¥<span id="cartTotal">0.00</span></div>
  <button class="submit-order" id="submitBtn">提交订单（假装支付）</button>
</div>

<!--弹窗：骑手事件 / 每日统计弹窗-->
<div class="modal" id="modal">

    <h3 id="modalTitle"></h3>
    <div class="event-text" id="modalText"></div>
    <div id="modalBtns"></div>

  {title:"路口红绿灯卡住",text:"路口信号灯故障，大家都在缓慢通行。",opts:["耐心等待","提醒骑手小心绕行"]},
  {title:"看到流浪小狗",text:"路边有一只流浪小狗摇尾巴跟着骑手。",opts:["投喂电子火腿肠","轻轻挥手告别小狗"]},
  {title:"风太大帽子吹飞",text:"一阵大风，骑手头盔旁边的帽子吹跑了。",opts:["帮骑手捡帽子","慢慢骑车不用急"]},
  {title:"路过花店",text:"路边花店花香飘过来，骑手停下看了一眼鲜花。",opts:["送骑手一朵电子小花","继续赶路"]},
  {title:"自行车链条掉了",text:"骑手电动车链条松动，需要简单修理一下。",opts:["耐心等待修理","骑手简单处理尽快出发"]},
  {title:"小朋友挥手打招呼",text:"路边小朋友开心对着骑手挥手。",opts:["骑手挥手回应小朋友","微笑点头继续走"]},
  {title:"看到彩虹啦",text:"雨停之后天边出现漂亮彩虹，骑手停下来欣赏。",opts:["一起欣赏彩虹","看完彩虹继续送"]},
  {title:"买到热乎乎豆浆",text:"骑手路过早餐店，闻到豆浆香味。",opts:["请骑手喝一杯热豆浆","抓紧送单"]},
  {title:"路面有小水坑",text:"前面路面有积水，担心溅到路人。",opts:["减速慢行避开行人","慢慢骑过去"]},
  {title:"遇到同行骑手",text:"碰到别的骑手伙伴，互相打了招呼。",opts:["让他们聊两句再走","简单问好继续赶路"]},
  {title:"听见好听的歌",text:"街边小店正在放很好听的歌曲。",opts:["停下来听一小段","边听歌边骑行"]},
  {title:"太阳很晒",text:"正午太阳火辣辣，骑手额头出汗了。",opts:["送电子遮阳帽","加快速度送到阴凉处"]}
];

let cart = [];
let totalPrice = 0;
let currentShopIndex = 0;
let orderTimer = null;
let statData = JSON.parse(localStorage.getItem("foodStat")) || {dayList:[],weekTotal:0,monthTotal:0,lastDate:""};

const shopEl = document.getElementById("shopList");
const foodEl = document.getElementById("foodList");
const searchEl = document.getElementById("searchInput");
const cartNumEl = document.getElementById("cartNum");
const cartTotalEl = document.getElementById("cartTotal");
const submitBtn = document.getElementById("submitBtn");
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalText = document.getElementById("modalText");
const modalBtns = document.getElementById("modalBtns");

// 渲染左侧店铺列表
function renderShop(){
  shopEl.innerHTML = "";
  shopData.forEach((shop,idx)=>{
    const div = document.createElement("div");
    div.className = "shop-item"+(idx===currentShopIndex?" active":"");
    div.innerText = shop.shopName;
    div.onclick = ()=>{
      currentShopIndex = idx;
      renderShop();renderFood();
    }
    shopEl.appendChild(div);
  })
}

// 渲染菜品（支持搜索）
function renderFood(keyword=""){
  foodEl.innerHTML = "";
  const shop = shopData[currentShopIndex];
  let foodList = shop.foods;
  if(keyword.trim()){
    let allFood = [];
    shopData.forEach(s=> allFood = allFood.concat(s.foods));
    foodList = allFood.filter(f=> f.name.includes(keyword) || f.desc.includes(keyword));
  }
  foodList.forEach(food=>{
    const card = document.createElement("div");
    card.className="food-card";
    card.innerHTML = `
    <div class="food-info">
      <div class="food-name">${food.name}</div>
      <div class="food-desc">${food.desc}</div>
      <div class="food-price">¥${food.price.toFixed(2)}</div>
    </div>
    <div style="display:flex;align-items:center">
      <button class="add-btn">+加入购物车</button>
    </div>
    `;
    card.querySelector(".add-btn").onclick = ()=>{
      cart.push(food);
      totalPrice += food.price;
      updateCart();
    }
    foodEl.appendChild(card);
  })
}

function updateCart(){
  cartNumEl.innerText = cart.length;
  cartTotalEl.innerText = totalPrice.toFixed(2);
}

// 弹窗控制
function openModal(title,text,opts,callback){
  modalTitle.innerText = title;
  modalText.innerText = text;
  modalBtns.innerHTML = "";
  modal.style.display="flex";
  if(opts && opts.length>0){
    opts.forEach(opt=>{
      const btn = document.createElement("button");
      btn.className="opt-btn";
      btn.innerText = opt;
      btn.onclick = ()=>{
        modal.style.display="none";
        if(callback) callback();
      }
      modalBtns.appendChild(btn);
    })
  }else{
    const btn = document.createElement("button");
    btn.className="opt-btn primary";
    btn.innerText = "知道啦";
    btn.onclick = ()=>{
      modal.style.display="none";
      if(callback) callback();
    }
    modalBtns.appendChild(btn);
  }
}

// 骑手事件轮询
function startRiderEvent(){
  let i=0;
  function nextEvent(){
    if(i>=riderEvents.length){
      openModal("订单送达！","你的外卖送到门口啦！✅ 假装收到，猪瘾压制成功！",[],()=>{
        saveStat();
        cart=[];totalPrice=0;updateCart();
      })
      return;
    }
    const e = riderEvents[i];
    openModal(e.title,e.text,e.opts,()=>{
      i++;
      orderTimer = setTimeout(nextEvent, 30*1000);
    })
  }
  nextEvent();
}

// 保存统计，每日弹窗
function saveStat(){
  const today = new Date().toLocaleDateString();
  if(statData.lastDate !== today){
    statData.lastDate = today;
    const dayCost = totalPrice;
    statData.dayList.push({date:today,cost:dayCost});
    // 简单周月统计
    statData.weekTotal = statData.dayList.slice(-7).reduce((s,i)=>s+i.cost,0);
    statData.monthTotal = statData.dayList.slice(-30).reduce((s,i)=>s+i.cost,0);
    localStorage.setItem("foodStat",JSON.stringify(statData));
    openModal("✅ 今日猪瘾治疗结算",
`今天假装下单节省：¥${dayCost.toFixed(2)}
近7周累计节省：¥${statData.weekTotal.toFixed(2)}
近30天累计节省：¥${statData.monthTotal.toFixed(2)}
忍住没有真下单，太棒啦！`,[])
  }
}

submitBtn.onclick = ()=>{
  if(cart.length===0){alert("购物车是空的！");return}
  openModal("下单成功！","订单提交成功，骑手正在接单，每隔30分钟会更新骑手动态，可以催单哦！",["开始等待外卖","催单"],()=>{
    startRiderEvent();
  })
}
searchEl.oninput = (e)=>{
  renderFood(e.target.value.trim())
}

renderShop();renderFood();
</script>
</body>
</html>
